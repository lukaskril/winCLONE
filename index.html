<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows 7 Demo</title>
  <style>
    :root {
      --taskbar-h: 46px;
      --win-border: #5f8dbf;
      --win-border-dark: #2d5f97;
      --glass: rgba(42, 80, 126, 0.85);
      --text: #1f1f1f;
      --icon-size: 72px;
    }

    * { box-sizing: border-box; user-select: none; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: #071f3a;
    }

    #desktop {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 20%, rgba(120,180,255,0.75), transparent 35%),
        radial-gradient(circle at 75% 30%, rgba(100,150,255,0.35), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(10,40,100,0.85), transparent 60%),
        linear-gradient(180deg, #3294f6 0%, #0c5ab4 45%, #0a3a7e 100%);
    }

    #desktop::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.16), transparent 46%),
        radial-gradient(circle at 50% 55%, rgba(255,255,255,.11), transparent 22%);
      pointer-events: none;
    }

    #desktop-icons {
      position: absolute;
      inset: 14px auto var(--taskbar-h) 12px;
      display: grid;
      grid-template-columns: repeat(2, var(--icon-size));
      grid-auto-rows: 90px;
      gap: 12px;
      z-index: 2;
    }

    .icon {
      width: var(--icon-size);
      text-align: center;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.6);
      border-radius: 6px;
      padding: 4px 2px;
      cursor: default;
    }

    .icon:hover { background: rgba(190,220,255,.23); }
    .icon:active { background: rgba(190,220,255,.35); }

    .icon .emoji {
      font-size: 34px;
      line-height: 38px;
      display: block;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
    }

    .icon span:last-child {
      font-size: 12px;
      line-height: 1.2;
      display: block;
      margin-top: 3px;
      word-break: break-word;
    }

    #windows-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
    }

    .window {
      position: absolute;
      width: 560px;
      min-width: 260px;
      min-height: 180px;
      border: 1px solid var(--win-border-dark);
      border-radius: 8px 8px 5px 5px;
      background: #f5f7fb;
      box-shadow: 0 14px 30px rgba(0,0,0,.45);
      overflow: hidden;
    }

    .window.inactive { filter: saturate(.68) brightness(.95); }

    .window-header {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 10px;
      color: #fff;
      background: linear-gradient(180deg, #8ac6ff 0%, #2b74c4 50%, #1d5ca4 100%);
      border-bottom: 1px solid #1f4c85;
      cursor: move;
    }

    .window-title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: calc(100% - 108px);
      text-shadow: 0 1px 1px rgba(0,0,0,.55);
    }

    .win-controls { display: flex; gap: 4px; }

    .ctrl {
      width: 29px;
      height: 20px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,.45);
      background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,.2));
      color: #123;
      font-weight: 700;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }
    .ctrl.close {
      background: linear-gradient(180deg, #ffb7af, #d84330);
      color: #fff;
      border-color: rgba(255,255,255,.35);
    }

    .window-content {
      height: calc(100% - 34px);
      background: #fff;
      overflow: auto;
    }

    .explorer-toolbar {
      height: 36px;
      background: linear-gradient(180deg, #edf4ff, #d5e7fb);
      border-bottom: 1px solid #b6cae7;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      font-size: 12px;
      color: #28456d;
    }

    .folder-grid {
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 16px;
    }

    .folder-item {
      text-align: center;
      font-size: 12px;
      color: #1d3961;
    }

    .folder-item .ico { font-size: 34px; display: block; margin-bottom: 2px; }

    .notepad {
      width: 100%;
      height: 100%;
      border: none;
      resize: none;
      outline: none;
      font: 14px/1.45 Consolas, "Courier New", monospace;
      padding: 12px;
      color: #000;
      background: #fff;
      user-select: text;
    }

    .paint-wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .paint-bar {
      height: 34px;
      border-bottom: 1px solid #ccd9ec;
      background: linear-gradient(180deg, #f6f9ff, #e8f0fd);
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      font-size: 12px;
    }

    .paint-bar button {
      border: 1px solid #95b0d3;
      background: #fff;
      border-radius: 4px;
      height: 24px;
      cursor: pointer;
      padding: 0 8px;
    }

    canvas {
      flex: 1;
      background: #fff;
      cursor: crosshair;
      display: block;
    }

    .calc {
      padding: 10px;
      background: #edf3fc;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .calc-display {
      height: 52px;
      border: 1px solid #9db4d6;
      background: #fff;
      border-radius: 4px;
      font-size: 28px;
      text-align: right;
      padding: 6px 10px;
      overflow: hidden;
      white-space: nowrap;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      flex: 1;
    }

    .calc-grid button {
      border: 1px solid #94aed0;
      background: linear-gradient(180deg, #fff, #e5edf8);
      border-radius: 3px;
      font-size: 16px;
      cursor: pointer;
    }

    #taskbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--taskbar-h);
      background: linear-gradient(180deg, rgba(104,157,213,.96), rgba(24,84,152,.95));
      border-top: 1px solid rgba(255,255,255,.45);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      z-index: 20;
      backdrop-filter: blur(2px);
    }

    #start {
      width: 98px;
      height: 38px;
      border-radius: 0 20px 20px 0;
      border: 1px solid #1f5b16;
      background: radial-gradient(circle at 30% 35%, #9ef77f, #3da62f 45%, #2f7f25 85%);
      color: #fff;
      font-size: 21px;
      font-style: italic;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0,0,0,.6);
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.4), 0 2px 4px rgba(0,0,0,.3);
      text-align: left;
      padding-left: 22px;
    }

    #task-buttons {
      display: flex;
      gap: 6px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .task-btn {
      max-width: 220px;
      min-width: 140px;
      height: 34px;
      border: 1px solid rgba(21,52,99,.85);
      background: linear-gradient(180deg, rgba(176,210,248,.95), rgba(75,130,191,.9));
      border-radius: 4px;
      color: #f5faff;
      font-size: 12px;
      text-align: left;
      padding: 0 10px;
      cursor: pointer;
      text-shadow: 0 1px 1px rgba(0,0,0,.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-btn.active {
      background: linear-gradient(180deg, rgba(227,243,255,.98), rgba(103,160,220,.95));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.4);
    }

    #tray {
      min-width: 94px;
      height: 34px;
      border-left: 1px solid rgba(255,255,255,.35);
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 1px 1px rgba(0,0,0,.55);
      padding-left: 8px;
    }

    #start-menu {
      position: absolute;
      left: 8px;
      bottom: var(--taskbar-h);
      width: 400px;
      height: 462px;
      background: linear-gradient(180deg, #e9f3ff, #f7fbff 35%, #eaf2fd);
      border: 1px solid #2e6eb6;
      border-radius: 9px 9px 0 0;
      box-shadow: 0 16px 26px rgba(0,0,0,.45);
      display: none;
      overflow: hidden;
      z-index: 22;
    }

    #start-menu.open { display: grid; grid-template-columns: 1fr 1fr; }

    .menu-col {
      padding: 10px;
      overflow: auto;
    }

    .menu-col.left {
      background: #fff;
      border-right: 1px solid #c7daef;
    }

    .menu-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #c4d8f0;
      grid-column: 1 / -1;
      background: linear-gradient(180deg, #6fb0f2, #3a86d3);
      color: #fff;
      font-weight: 600;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffd8ab, #ef7f29);
      border: 2px solid rgba(255,255,255,.8);
    }

    .menu-item {
      padding: 7px 8px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    .menu-item:hover { background: #dcecff; }

    .shutdown {
      position: absolute;
      right: 12px;
      bottom: 8px;
      border: 1px solid #8f9fba;
      border-radius: 3px;
      background: linear-gradient(180deg, #fff, #dfe6f1);
      padding: 4px 11px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="desktop">
    <div id="desktop-icons">
      <div class="icon" data-app="computer"><span class="emoji">🖥️</span><span>Computer</span></div>
      <div class="icon" data-app="recycle"><span class="emoji">🗑️</span><span>Koš</span></div>
      <div class="icon" data-app="notepad"><span class="emoji">📝</span><span>Poznámkový blok</span></div>
      <div class="icon" data-app="paint"><span class="emoji">🎨</span><span>Malování</span></div>
      <div class="icon" data-app="calc"><span class="emoji">🧮</span><span>Kalkulačka</span></div>
    </div>

    <div id="windows-layer"></div>

    <div id="start-menu">
      <div class="menu-user"><div class="avatar"></div> Uživatel</div>
      <div class="menu-col left">
        <div class="menu-item" data-app="notepad">📄 Poznámkový blok</div>
        <div class="menu-item" data-app="paint">🎨 Malování</div>
        <div class="menu-item" data-app="calc">🧮 Kalkulačka</div>
        <div class="menu-item" data-app="computer">🖥️ Computer</div>
      </div>
      <div class="menu-col">
        <div class="menu-item">🗂️ Dokumenty</div>
        <div class="menu-item">🖼️ Obrázky</div>
        <div class="menu-item">🎵 Hudba</div>
        <div class="menu-item">⚙️ Ovládací panely</div>
        <div class="menu-item">❓ Nápověda a podpora</div>
      </div>
      <button class="shutdown">Vypnout</button>
    </div>

    <div id="taskbar">
      <button id="start">start</button>
      <div id="task-buttons"></div>
      <div id="tray">--:--</div>
    </div>
  </div>

  <script>
    const windowsLayer = document.getElementById('windows-layer');
    const taskButtons = document.getElementById('task-buttons');
    const start = document.getElementById('start');
    const startMenu = document.getElementById('start-menu');
    const tray = document.getElementById('tray');

    let z = 10;
    let idCounter = 1;
    const openWindows = new Map();

    function updateClock() {
      const d = new Date();
      tray.textContent = d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function appContent(type) {
      if (type === 'computer' || type === 'recycle') {
        return `
          <div class="explorer-toolbar">Uspořádat • Sdílet s • Nová složka</div>
          <div class="folder-grid">
            <div class="folder-item"><span class="ico">📁</span>Plocha</div>
            <div class="folder-item"><span class="ico">📁</span>Stažené</div>
            <div class="folder-item"><span class="ico">📁</span>Dokumenty</div>
            <div class="folder-item"><span class="ico">💽</span>Lokální disk (C:)</div>
            <div class="folder-item"><span class="ico">💾</span>USB Disk</div>
            <div class="folder-item"><span class="ico">🧩</span>Program Files</div>
          </div>`;
      }
      if (type === 'notepad') {
        return `<textarea class="notepad">Windows 7 demo\n\nToto je interaktivní ukázka prostředí.\nZkus přesouvat okna, minimalizovat je a kreslit v Malování.</textarea>`;
      }
      if (type === 'paint') {
        return `
          <div class="paint-wrap">
            <div class="paint-bar">
              <button data-color="#000000">Černá</button>
              <button data-color="#e11d48">Červená</button>
              <button data-color="#0f766e">Zelená</button>
              <button data-color="#1d4ed8">Modrá</button>
              <button data-action="clear">Vymazat</button>
            </div>
            <canvas id="paint-canvas" width="900" height="500"></canvas>
          </div>`;
      }
      if (type === 'calc') {
        const keys = ['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+'];
        return `
          <div class="calc">
            <div class="calc-display" id="calc-display">0</div>
            <div class="calc-grid">${keys.map(k => `<button>${k}</button>`).join('')}</div>
          </div>`;
      }
      return '<div style="padding:10px">Neznámá aplikace.</div>';
    }

    function pretty(type) {
      return {
        computer: 'Computer',
        recycle: 'Koš',
        notepad: 'Poznámkový blok',
        paint: 'Malování',
        calc: 'Kalkulačka'
      }[type] || type;
    }

    function focusWindow(win) {
      document.querySelectorAll('.window').forEach(w => w.classList.add('inactive'));
      document.querySelectorAll('.task-btn').forEach(b => b.classList.remove('active'));
      win.classList.remove('inactive');
      win.style.zIndex = ++z;
      const tb = taskButtons.querySelector(`[data-id="${win.dataset.id}"]`);
      if (tb) tb.classList.add('active');
    }

    function attachDrag(win, header) {
      let startX = 0, startY = 0, left = 0, top = 0, dragging = false;
      header.addEventListener('mousedown', e => {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        left = win.offsetLeft;
        top = win.offsetTop;
        focusWindow(win);
      });
      window.addEventListener('mousemove', e => {
        if (!dragging) return;
        let nx = left + (e.clientX - startX);
        let ny = top + (e.clientY - startY);
        nx = Math.max(0, Math.min(window.innerWidth - 220, nx));
        ny = Math.max(0, Math.min(window.innerHeight - 120, ny));
        win.style.left = nx + 'px';
        win.style.top = ny + 'px';
      });
      window.addEventListener('mouseup', () => dragging = false);
    }

    function initPaint(win) {
      const canvas = win.querySelector('#paint-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let draw = false;
      let color = '#000';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';

      function pos(e) {
        const r = canvas.getBoundingClientRect();
        return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
      }

      canvas.addEventListener('mousedown', e => {
        draw = true;
        const p = pos(e);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      });
      canvas.addEventListener('mousemove', e => {
        if (!draw) return;
        const p = pos(e);
        ctx.strokeStyle = color;
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      });
      window.addEventListener('mouseup', () => draw = false);

      win.querySelectorAll('.paint-bar button').forEach(b => {
        b.addEventListener('click', () => {
          if (b.dataset.action === 'clear') {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          } else {
            color = b.dataset.color;
          }
        });
      });
    }

    function initCalc(win) {
      const display = win.querySelector('#calc-display');
      if (!display) return;
      let expr = '';
      win.querySelectorAll('.calc-grid button').forEach(b => {
        b.addEventListener('click', () => {
          const v = b.textContent;
          if (v === '=') {
            try {
              expr = String(Function(`"use strict"; return (${expr || 0})`)());
            } catch {
              expr = 'Error';
            }
          } else {
            expr = expr === 'Error' ? v : expr + v;
          }
          display.textContent = expr || '0';
        });
      });
    }

    function openApp(type) {
      const id = 'w' + idCounter++;
      const win = document.createElement('div');
      win.className = 'window';
      win.dataset.id = id;
      win.style.left = Math.floor(150 + Math.random() * 280) + 'px';
      win.style.top = Math.floor(70 + Math.random() * 150) + 'px';
      win.style.height = (type === 'paint' ? 450 : 390) + 'px';
      if (type === 'calc') { win.style.width = '300px'; win.style.height = '390px'; }

      win.innerHTML = `
        <div class="window-header">
          <div class="window-title">${pretty(type)}</div>
          <div class="win-controls">
            <button class="ctrl min">—</button>
            <button class="ctrl close">✕</button>
          </div>
        </div>
        <div class="window-content">${appContent(type)}</div>
      `;

      const taskBtn = document.createElement('button');
      taskBtn.className = 'task-btn';
      taskBtn.dataset.id = id;
      taskBtn.textContent = pretty(type);
      taskButtons.appendChild(taskBtn);

      taskBtn.addEventListener('click', () => {
        if (win.style.display === 'none') {
          win.style.display = 'block';
          focusWindow(win);
        } else if (taskBtn.classList.contains('active')) {
          win.style.display = 'none';
          taskBtn.classList.remove('active');
        } else {
          focusWindow(win);
        }
      });

      win.querySelector('.close').addEventListener('click', () => {
        win.remove();
        taskBtn.remove();
        openWindows.delete(id);
      });
      win.querySelector('.min').addEventListener('click', () => {
        win.style.display = 'none';
        taskBtn.classList.remove('active');
      });

      win.addEventListener('mousedown', () => focusWindow(win));
      attachDrag(win, win.querySelector('.window-header'));
      windowsLayer.appendChild(win);
      openWindows.set(id, { type, win, taskBtn });
      focusWindow(win);
      initPaint(win);
      initCalc(win);
    }

    document.querySelectorAll('.icon').forEach(icon => {
      icon.addEventListener('dblclick', () => openApp(icon.dataset.app));
    });

    document.querySelectorAll('.menu-item[data-app]').forEach(item => {
      item.addEventListener('click', () => {
        openApp(item.dataset.app);
        startMenu.classList.remove('open');
      });
    });

    start.addEventListener('click', () => startMenu.classList.toggle('open'));
    document.addEventListener('click', e => {
      if (!startMenu.contains(e.target) && e.target !== start) startMenu.classList.remove('open');
    });

    startMenu.querySelector('.shutdown').addEventListener('click', () => {
      alert('Toto je demo – vypnutí je pouze simulované 🙂');
      startMenu.classList.remove('open');
    });
  </script>
</body>
</html>
